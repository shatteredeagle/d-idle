<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
<title>d.idle watch</title>
<link rel="stylesheet" href="helper.css">
</head>
<body>
<main>
  <h1 id="title">d.idle watch</h1>
  <p id="msg" role="status"></p>
  <form id="form" autocomplete="off">
    <label for="address">Where is the game?</label>
    <input id="address" name="address" placeholder="host:8891" spellcheck="false">
    <p id="error" class="error" hidden></p>
    <div class="row">
      <button type="submit" class="primary">Save and open</button>
      <button type="button" id="retry">Retry now</button>
    </div>
  </form>
</main>
<script src="helper.js"></script>
</body>
</html>
