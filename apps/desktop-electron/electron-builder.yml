# Packaging for the d.idle watch app (docs/desktop-electron.md). Never publishes: scripts pass --publish never.
appId: org.d2idle.watch
productName: d2idle-watch
copyright: GPL-3.0-or-later, see THIRD_PARTY.md
artifactName: d2idle-watch-${version}-${os}-${arch}.${ext}
compression: maximum
electronLanguages: [en-US]
afterPack: build/after-pack.js
files:
  - package.json
  - src/**
  - build/icon.png
  - build/tray.png
  - build/trayTemplate*.png
  - build/feed.json
asarUnpack: []
directories:
  buildResources: build
  output: dist
win:
  target: [{target: nsis, arch: [x64]}, {target: portable, arch: [x64]}]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: d2idle-watch-setup-${version}-x64.exe
portable:
  artifactName: d2idle-watch-${version}-x64-portable.exe
linux:
  target: [AppImage, deb]
  category: Game
  icon: build/icon.png
  executableName: d2idle-watch
  syncDesktopName: true
  maintainer: d.idle contributors
  synopsis: d.idle watch
  desktop:
    entry:
      Name: d.idle watch
      Comment: Watch your d.idle hero
      StartupWMClass: d2idle-watch
      Actions: Inventory;Policy;Return;Setup;
    desktopActions:
      Inventory: {Name: Inventory, Exec: d2idle-watch --page inventory}
      Policy: {Name: Policy, Exec: d2idle-watch --page policy}
      Return: {Name: Return screen, Exec: d2idle-watch --page return}
      Setup: {Name: Change address, Exec: d2idle-watch --setup}
mac:
  # Unsigned personal build: ad-hoc signature only (Apple Silicon kills a binary with no signature at all),  no hardened runtime, no notarisation (Gatekeeper workaround in docs/desktop-electron.md).
  target:
    - {target: dmg, arch: [universal]}
    - {target: zip, arch: [universal]}
  icon: build/icon.icns
  category: public.app-category.games
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  artifactName: d2idle-watch-${version}-mac-universal.dmg
  sign: false
