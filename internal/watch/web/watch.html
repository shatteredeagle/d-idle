<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>d.idle watch screen</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/watch/app.css">
</head><body>
<header>
 <b>d.idle</b>
 <span id="state" class="tag">connecting</span>
 <span>uptime <b id="uptime">-</b> <small id="window"></small></span>
 <span id="deaths"></span>
 <span id="clock"></span>
 <span id="msg" class="err" role="status"></span>
</header>
<main>
 <section class="col">
  <div class="pane" id="gamepane"><h2>Game</h2>
   <div id="frame"><img id="shot" alt="game frame" hidden><p id="noframe">No game frame here (simulated runner or the frame feed is off).</p></div>
  </div>
  <div class="pane"><h2>Orders</h2>
   <form id="orderform">
    <select id="okind" aria-label="order"><option value="go">Go to</option><option value="fight">Fight here</option><option value="home">Come home</option></select>
    <select id="oarea" aria-label="area"></select>
    <input id="omin" type="number" min="1" max="240" value="10" aria-label="minutes"> min
    <button type="submit">Give order</button>
   </form>
   <ul id="orders"></ul>
  </div>
  <div class="pane"><h2>Rules <button id="revokeall" type="button">Revoke all</button></h2>
   <p class="hint">Every rule the hero learned from you. A rule never revokes itself.</p>
   <ul id="rules"></ul>
  </div>
 </section>
 <section class="col">
  <div class="pane"><h2>Thoughts</h2>
   <div id="thoughts"></div>
   <ul id="feed"></ul>
  </div>
  <div class="pane"><h2>Journal <small>(permanent; missed questions stay here)</small></h2>
   <ul id="journal"></ul>
  </div>
 </section>
</main>
<script src="/watch/app.js"></script>
</body></html>
