# CI for the public repository, on GitHub-hosted runners (ubuntu-latest). No secrets beyond the built-in GITHUB_TOKEN and, in notify-failure only, DISCORD_PROGRESS_WEBHOOK.
# `checks` is light and always runs; `test` is heavy and skipped when only docs, cards or markdown changed;
# `notify-failure` posts a failed non-PR run to the progress feed (secret DISCORD_PROGRESS_WEBHOOK, only in that job);
# `release` builds the tarball and publishes a GitHub release on a v* tag. What runs and the local commands: docs/ci.md.
name: ci
# Branch pushes other than main (agent branches, and gh-pages, which the status publisher pushes) do not trigger it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      feed_test:
        description: "Post one test notice to the progress feed through notify-failure"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"   # AGENTS.md; go.mod only holds the language floor
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"     # the pinned OpenSpec CLI in tools/openspec.sh needs node >= 20.19
      - name: changecheck (cards, owners, merges; runs openspec validate --all --strict)
        run: go run ./cmd/changecheck -cli
      - name: leakcheck (fail on any hit)
        run: go run ./cmd/leakcheck -mode fail
      - name: Hygiene (no MPQ/saves/keys, no big files)
        run: tools/ci/check.sh --hygiene-only
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          [ -z "$out" ] || { echo "gofmt differs:"; echo "$out"; exit 1; }
      - name: go vet (changecheck and leakcheck; the whole repo is vetted in the test job)
        run: go vet ./cmd/changecheck ./cmd/leakcheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Do code files differ from the base? (docs/cards-only changes skip the rest)
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${BASE:-$BEFORE}"
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] || [ -z "$base" ] || echo "$base" | grep -q '^0*$' || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qvE '^(docs/|openspec/|backlog/|[^/]*\.md$|\.github/ISSUE|tools/(emu|spec|backlog|shims|floors)/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs/cards only: skipping the heavy steps"; echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Gate (gofmt, go vet ./...)
        if: steps.scope.outputs.code == 'true'
        run: tools/ci/check.sh
      - name: Tests (short, -p 2, no game data, tests that need tables skip)
        if: steps.scope.outputs.code == 'true'
        run: PAR=2 tools/ci/test.sh
      - name: Scripts (bash -n, winereap_test, container-checklist, release dry run)
        if: steps.scope.outputs.code == 'true'
        run: tools/ci/scripts.sh

  release:
    needs: [checks, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Build release tarball
        run: packaging/release.sh "${GITHUB_REF_NAME}"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md in the tarball."
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # Failure notice for #progress. GitHub's webhook cannot filter workflow_run by conclusion, so the repo webhook carries
  # release and pull_request only and this job posts failures on main/tags. always() is needed so the feed_test dispatch
  # can run when the needs succeeded; on a normal green run the if is false and the job is skipped.
  notify-failure:
    needs: [checks, test]
    if: ${{ always() && ((failure() && github.event_name != 'pull_request') || (github.event_name == 'workflow_dispatch' && inputs.feed_test)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Post to #progress
        env:
          DISCORD_PROGRESS_WEBHOOK: ${{ secrets.DISCORD_PROGRESS_WEBHOOK }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          FEED_TEST: ${{ inputs.feed_test }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ "$FEED_TEST" = true ]; then
            msg="feed test: CI failure notices are wired"
          else
            msg="CI failed on main: ${SHA:0:7} ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          fi
          body=$(jq -nc --arg c "$msg" '{content: $c, allowed_mentions: {parse: []}}')
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$body" "$DISCORD_PROGRESS_WEBHOOK"
