# Tests and packages the Electron desktop app (apps/desktop-electron, docs/desktop-electron.md). Separate from ci.yml:
# nothing in ci.yml needs it and ci.yml never runs Node. It publishes nothing: no release, no tag, no secret; artifacts
# stay on the workflow run. Never run on GitHub yet (written 2026-11-10; the same steps pass on the worker host).
name: desktop-electron
on:
  workflow_dispatch:
  pull_request:
    paths: ["apps/desktop-electron/**", ".github/workflows/desktop-electron.yml"]
  push:
    branches: [main]
    paths: ["apps/desktop-electron/**", ".github/workflows/desktop-electron.yml"]
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: apps/desktop-electron
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      # Lifecycle scripts stay off for every dependency; only electron's own installer runs, by name.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y xvfb
        working-directory: .
      # The hosted runner restricts unprivileged user namespaces, so the smoke run needs --no-sandbox there (test only).
      - run: D2E_SMOKE_NO_SANDBOX=1 xvfb-run -a npm run smoke
  # Unsigned personal macOS build (universal arm64+x64). No signing or notarisation env, nothing published.
  package-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The universal build needs both Electron binaries; electron-builder downloads the second one itself.
      - run: node node_modules/electron/install.js
      - run: node scripts/write-feed.js
        env:
          D2IDLE_UPDATE_FEED: ${{ vars.D2IDLE_UPDATE_FEED }}
      - run: npx electron-builder --mac dmg zip --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Same nullglob pattern as the other package job: an unmatched glob must not hide the real error.
      - run: |
          cd dist
          shopt -s nullglob
          files=(*.dmg *.zip)
          [ ${#files[@]} -gt 0 ] || { echo "no artifacts in dist"; exit 1; }
          shasum -a 256 "${files[@]}" | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d2idle-watch-macos-universal
          path: |
            apps/desktop-electron/dist/*.dmg
            apps/desktop-electron/dist/*.zip
            apps/desktop-electron/dist/SHA256SUMS
          if-no-files-found: error
  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, args: "--linux AppImage deb", name: linux}
          - {os: windows-latest, args: "--win nsis portable", name: windows}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: node scripts/write-feed.js
        env:
          D2IDLE_UPDATE_FEED: ${{ vars.D2IDLE_UPDATE_FEED }}
      - run: npx electron-builder ${{ matrix.args }} --publish never
      # Only the artifact types this OS builds exist; an unmatched glob must not fail the step.
      - run: |
          cd dist
          shopt -s nullglob
          files=(*.AppImage *.deb *.exe *.dmg *.zip)
          [ ${#files[@]} -gt 0 ] || { echo "no artifacts in dist"; exit 1; }
          sha256sum "${files[@]}" | tee SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: d2idle-watch-${{ matrix.name }}
          path: |
            apps/desktop-electron/dist/*.AppImage
            apps/desktop-electron/dist/*.deb
            apps/desktop-electron/dist/*.exe
            apps/desktop-electron/dist/SHA256SUMS
          if-no-files-found: error
