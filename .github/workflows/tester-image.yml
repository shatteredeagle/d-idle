# Tester image: build deploy/d2d-container from public inputs and (only on confirmation) push it to ghcr.io.
# INERT until a person acts: the only trigger is workflow_dispatch, the push job needs input confirm=publish AND the
# environment `tester-publish` (create it with a required reviewer; docs/tester-registry.md). Without confirm the run is a
# dry run: it builds and checks, pushes nothing. Never runs on pull_request or push. No secrets: GITHUB_TOKEN only, and
# the package write permission exists only in the publish job. amd64 only.
name: tester-image
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version X.Y.Z (becomes the image tag)"
        type: string
        required: true
      confirm:
        description: "Type publish to push to ghcr.io (anything else: dry run, nothing is pushed)"
        type: string
        default: ""

concurrency:
  group: tester-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/shatteredeagle/didle-tester
  LICENSE: GPL-3.0-or-later AND LicenseRef-didle-bot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version must look like X.Y.Z" >&2; exit 1 ;;
          esac
      - name: Free disk (the fork build is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4 # major pin; the bot repo at the dispatched ref
      - uses: actions/setup-go@v5 # major pin
        with:
          go-version: "1.27.3"
          cache: false
      - uses: docker/setup-buildx-action@v3 # major pin
      - name: Static checks
        run: |
          go run ./cmd/leakcheck -mode fail
          go test -count=1 ./deploy/d2d-container/
          DRYRUN_ONLY=1 deploy/d2d-container/smoke.sh
      - name: Assemble the build context (public inputs, sha256 checked)
        run: deploy/d2d-container/context.sh "$RUNNER_TEMP/ctx"
      - name: Fork commit
        id: fork
        run: echo "commit=$(sed -n 's/.*commit \([0-9a-f]\{40\}\)\.*$/\1/p' "$RUNNER_TEMP/ctx/licenses/SOURCE.txt" | head -1)" >> "$GITHUB_OUTPUT"
      - name: Build (amd64, loaded locally, not pushed)
        uses: docker/build-push-action@v6 # major pin
        with:
          context: ${{ runner.temp }}/ctx
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: didle-tester:check
          cache-from: type=gha,scope=tester
          cache-to: type=gha,scope=tester,mode=max
      - name: No Blizzard data in the image
        run: |
          hits=$(docker run --rm --entrypoint sh didle-tester:check -c "find / -xdev \( -iname '*.mpq' -o -iname 'game.exe' -o -iname '*.d2s' -o -iname 'd2*.dll' \) 2>/dev/null")
          [ -z "$hits" ] || { echo "game data in the image: $hits" >&2; exit 1; }
          docker run --rm --entrypoint sh didle-tester:check -c 'ls /usr/share/licenses/d2d/ && test -x /opt/d2d/d2d && test -x /opt/d2lod/d2bot'
          docker image inspect -f 'image size {{.Size}} bytes' didle-tester:check

  publish:
    # Runs only when the person typed confirm=publish, and then waits for the environment's required reviewer.
    if: inputs.confirm == 'publish'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: tester-publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk (the fork build is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
      - uses: actions/checkout@v4 # major pin
      - uses: actions/setup-go@v5 # major pin
        with:
          go-version: "1.27.3"
          cache: false
      - uses: docker/setup-buildx-action@v3 # major pin
      - name: Assemble the build context
        run: deploy/d2d-container/context.sh "$RUNNER_TEMP/ctx"
      - name: Fork commit
        id: fork
        run: echo "commit=$(sed -n 's/.*commit \([0-9a-f]\{40\}\)\.*$/\1/p' "$RUNNER_TEMP/ctx/licenses/SOURCE.txt" | head -1)" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io with the workflow token
        uses: docker/login-action@v3 # major pin
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64)
        uses: docker/build-push-action@v6 # major pin
        with:
          context: ${{ runner.temp }}/ctx
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:d2d-${{ steps.fork.outputs.commit }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=${{ env.LICENSE }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.title=d.idle tester image
            io.didle.fork.source=https://github.com/shatteredeagle/d2d-didle
            io.didle.fork.commit=${{ steps.fork.outputs.commit }}
          cache-from: type=gha,scope=tester
