# Runs unprivileged: every writable path is under /tmp (root filesystem is read-only).
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/nx_body;
  proxy_temp_path /tmp/nx_proxy;
  fastcgi_temp_path /tmp/nx_fcgi;
  uwsgi_temp_path /tmp/nx_uwsgi;
  scgi_temp_path /tmp/nx_scgi;
  map $http_upgrade $conn_upgrade { default upgrade; '' close; }
  server {
    listen 6420;
    server_name _;
    location / {
      # Read-only: the web UI's edits are POST/PUT/PATCH/DELETE and never reach Backlog.md.
      limit_except GET HEAD { deny all; }
      proxy_pass http://127.0.0.1:6421;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:6421;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conn_upgrade;
      proxy_read_timeout 3600s;
    }
  }
}
