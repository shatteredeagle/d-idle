# Variant B: own LAN address on the br0 network, for Nginx Proxy Manager
# (NPM runs on br0 and cannot reach the NAS's own address or bridge addresses).
# Replace docker-compose.yml with this file; pick a free address (see the doc), no published port.
name: backlog_board
services:
  backlog-board:
    container_name: backlog-board
    build:
      context: https://github.com/shatteredeagle/d-idle.git#main:deploy/backlog-board
    image: backlog-board:1.55.3
    restart: unless-stopped
    user: "99:100"
    environment:
      REPO_URL: https://github.com/shatteredeagle/d-idle
      BRANCH: main
      SYNC_INTERVAL: "300"
      TZ: America/New_York
    volumes:
      - /mnt/user/appdata/backlog-board/data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    networks:
      br0:
        ipv4_address: <free-br0-address>
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:6420/api/tasks"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
networks:
  br0:
    external: true
